[project]
name = "idol-imagine-fast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prithiv Sakthi U R", email = "prithivsakthi676@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "diffusers>=0.36",
    "gradio==6.31.0",
    "gradio-rerun==0.42.0",
    "huggingface-hub>=0.34",
    "numpy>=1.26",
    "pillow>=10.0",
    "plyfile>=1.0",
    "rerun-sdk==0.42.0",
    "safetensors>=0.4",
    "tensordict>=0.8",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "tqdm>=4.66",
    "transformers>=4.56",
]

[project.scripts]
idol-imagine-fast = "idol_imagine_fast:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
